<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story · poll space</title><style>
@font-face{font-family:Raleway;src:url('../assets/Raleway-Variable.ttf');font-weight:100 900}
*{box-sizing:border-box}body{margin:0;background:#d9dcdf;font-family:Raleway,sans-serif}header{padding:24px}
.slide{position:relative;width:1080px;height:1920px;background:#efede8;color:#15161a;overflow:hidden}
.abs{position:absolute}.l{font-size:22px;letter-spacing:4px;font-weight:600;color:#6b6a66;text-transform:uppercase}

.guide{position:absolute;left:140px;top:1000px;width:800px;height:600px;border:3px dashed #ff7a59;border-radius:35px;display:grid;place-items:center;font-size:28px;text-align:center;color:#ff7a59}
.exporting [data-review-only]{display:none!important}.exporting .slide{zoom:1!important}
</style><header data-review-only>Minimalism · Story · 1080 × 1920. The dashed poll guide is removed in the PNG.</header>
